<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TripUp mid-fi v8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* TripUp mid-fi wireframe, Airbnb-style patterns. Full screen and responsive; UX and flow first, visuals later. */
:root {
  --text: #09090b; --muted: #71717a; --subtle: #a1a1aa; --border: #e4e4e7; --border-strong: #d4d4d8;
  --bg: #ffffff; --bg-subtle: #fafafa; --bg-muted: #f4f4f5; --ph: #e4e4e7;
  --primary: #09090b; --on-primary: #ffffff; --live: #059669; --live-bg: #ecfdf5; --danger: #dc2626; --warn-bg: #fffbeb;
  --display: "IBM Plex Sans Condensed", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --max: 640px; --pad: 20px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: Geist, system-ui, sans-serif; color: var(--text); background: var(--bg); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Layout */
.page { max-width: var(--max); margin: 0 auto; padding: 0 var(--pad) 140px; animation: enter 240ms var(--ease-out); }
.page.back-in { animation-name: enter-back; }
@keyframes enter { from { opacity: 0; transform: translateX(16px); } }
@keyframes enter-back { from { opacity: 0; transform: translateX(-16px); } }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); }
.topbar-in { max-width: var(--max); margin: 0 auto; height: 60px; padding: 0 var(--pad); display: flex; align-items: center; gap: 12px; }
.topbar .t { flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.circle { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); background: var(--bg); transition: transform 160ms var(--ease-out); }
.circle:active { transform: scale(0.94); }
.circle.ghost { border-color: transparent; }
.spacer { width: 36px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 40px; letter-spacing: -0.01em; }
h2 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 28px; }
h3 { font-size: 16px; font-weight: 600; line-height: 22px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.section { padding: 28px 0; border-top: 1px solid var(--border); }
.section:first-of-type { border-top: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
.link { text-decoration: underline; text-underline-offset: 2px; font-weight: 500; font-size: 14px; }

/* Bars */
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.bottombar-in { max-width: var(--max); margin: 0 auto; padding: 14px var(--pad); display: flex; align-items: center; gap: 16px; }
.bottombar .info { flex: 1; min-width: 0; }
.bottombar .info b { display: block; font-size: 16px; }
.bottombar .info span { font-size: 13px; color: var(--muted); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { max-width: var(--max); margin: 0 auto; display: flex; justify-content: space-around; padding: 8px 0 10px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--subtle); min-width: 72px; position: relative; }
.tab.on { color: var(--text); }
.tab .dot { position: absolute; top: 0; right: 22px; width: 8px; height: 8px; border-radius: 4px; background: var(--danger); }

/* Buttons */
.btn { height: 48px; padding: 0 22px; border-radius: 10px; background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 160ms var(--ease-out), opacity 160ms ease; white-space: nowrap; }
.btn:active { transform: scale(0.97); }
.btn.block { width: 100%; }
.btn.outline { background: var(--bg); color: var(--text); border: 1px solid var(--text); }
.btn.soft { background: var(--bg-muted); color: var(--text); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 14px; border-radius: 8px; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.pill { height: 40px; padding: 0 6px 0 16px; border: 1px solid var(--border-strong); border-radius: 20px; display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; transition: transform 160ms var(--ease-out); }
.pill:active { transform: scale(0.97); }
.chip { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--border-strong); font-size: 14px; font-weight: 500; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--bg); font-size: 12px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.badge.live::before { content: ""; width: 7px; height: 7px; border-radius: 4px; background: var(--live); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--bg-muted); font-size: 12px; font-weight: 500; color: var(--muted); }
.tag.live { background: var(--live-bg); color: var(--live); }

/* Avatars */
.av { --s: 28px; width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); display: inline-grid; place-items: center; font-size: calc(var(--s) * .42); font-weight: 600; color: #18181b; border: 2px solid var(--bg); flex: none; }
.av.l { --s: 44px; }
.av.xl { --s: 64px; }
.av.s { --s: 22px; border-width: 1.5px; }
.stack { display: inline-flex; }
.stack .av + .av { margin-left: -9px; }

/* Photos and placeholders */
.ph { background: var(--ph); display: grid; place-items: center; color: var(--subtle); overflow: hidden; position: relative; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph .ph-label { font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; }

/* Trips (Airbnb wishlists grid) */
.hero { display: block; width: 100%; text-align: left; transition: transform 160ms var(--ease-out); }
.hero:active { transform: scale(0.99); }
.collage { display: grid; gap: 2px; border-radius: 16px; overflow: hidden; }
.collage.c3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 1.45; }
.collage.c3 > :first-child { grid-row: span 2; }
.collage.c4 { grid-template-columns: 1fr 1fr; aspect-ratio: 1; }
.collage .ph { width: 100%; height: 100%; }
.hero-wrap { position: relative; }
.hero-wrap .badge { position: absolute; left: 12px; top: 12px; }
.hero-wrap .stack { position: absolute; right: 12px; bottom: 12px; }
.hero-title { margin-top: 12px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.status-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--bg-subtle); border: 1px solid var(--border); font-size: 14px; }
.status-line .icon { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 14px; }
.card-small { text-align: left; transition: transform 160ms var(--ease-out); }
.card-small:active { transform: scale(0.98); }
.card-small h3 { margin-top: 8px; font-size: 15px; }

/* Rows (Airbnb "What you'll do" / host rows) */
.row { display: flex; align-items: center; gap: 14px; padding: 12px 0; width: 100%; text-align: left; }
.row .thumb { width: 64px; height: 64px; border-radius: 12px; flex: none; }
.row .body { flex: 1; min-width: 0; }
.row .body b { display: block; font-weight: 600; font-size: 15px; }
.row .body span { display: block; font-size: 13px; color: var(--muted); }
.row .time { width: 46px; font-size: 13px; font-weight: 600; color: var(--muted); flex: none; }
.row.done .body b { color: var(--muted); }
.row.flash { animation: flash 1.6s ease 2; border-radius: 12px; }
@keyframes flash { 50% { background: var(--live-bg); } }
.list-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
.list-row:last-child { border-bottom: 0; }
.list-row .body { flex: 1; min-width: 0; }
.list-row .body b { display: block; font-weight: 500; }
.list-row .body span { display: block; font-size: 13px; color: var(--muted); }
.list-row .amt { font-weight: 600; white-space: nowrap; }
.chev { color: var(--subtle); }

/* Poll (Airbnb collaborative wishlist) */
.vote-card { padding-bottom: 24px; }
.vote-card .img { position: relative; aspect-ratio: 1.5; border-radius: 16px; }
.vote-card .img .badge { position: absolute; left: 12px; top: 12px; }
.vote-card .img .stack { position: absolute; right: 12px; top: 12px; }
.vote-card .line1 { display: flex; justify-content: space-between; margin-top: 12px; gap: 12px; }
.vote-card .meta { font-size: 14px; color: var(--muted); }
.vote-card .note { margin-top: 8px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.vote-actions { margin-top: 10px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border: 1px solid var(--border); border-radius: 12px; }
.vote-actions .link { flex: 1; text-align: left; }
.thumb-btn { height: 40px; min-width: 52px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--muted); transition: transform 160ms var(--ease-out), background-color 160ms ease; }
.thumb-btn:active { transform: scale(0.94); }
.thumb-btn.on { background: var(--text); color: var(--bg); }
.thumb-btn.down.on { background: var(--bg-muted); color: var(--text); }
.bar { height: 4px; border-radius: 2px; background: var(--bg-muted); margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--text); transition: width 300ms var(--ease-out); }

/* Forms */
.field { display: block; border: 1px solid var(--border-strong); border-radius: 12px; padding: 10px 14px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.field input { width: 100%; border: 0; outline: 0; font-size: 16px; background: transparent; padding: 2px 0; }
.field:focus-within { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
.check { width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; flex: none; color: transparent; }
.check.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.switch { width: 44px; height: 26px; border-radius: 13px; background: var(--border-strong); position: relative; flex: none; transition: background-color 200ms ease; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform 200ms var(--ease-out); }
.switch.on { background: var(--text); }
.switch.on::after { transform: translateX(18px); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-muted); border-radius: 10px; padding: 3px; }
.seg button { height: 36px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.hint { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--bg-subtle); border: 1px solid var(--border); font-size: 14px; }
.hint.good { background: var(--live-bg); border-color: transparent; }
.big-amount { font-family: var(--display); font-weight: 700; font-size: 48px; line-height: 52px; }

/* Balance */
.stat { border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; gap: 20px; align-items: center; }
.stat .nums { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; display: flex; align-items: baseline; gap: 10px; }
.stat s { color: var(--subtle); font-size: 28px; }
.paid { color: var(--live); font-weight: 600; font-size: 14px; display: inline-flex; gap: 4px; align-items: center; }

/* Sheet / dialog */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(9,9,11,.4); display: flex; align-items: flex-end; justify-content: center; animation: fade 200ms ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px var(--pad) calc(24px + env(safe-area-inset-bottom)); animation: up 320ms cubic-bezier(0.32, 0.72, 0, 1); }
@keyframes up { from { transform: translateY(100%); } }
.sheet-head { display: flex; align-items: center; height: 56px; margin-bottom: 4px; }
.sheet-head .t { flex: 1; text-align: center; font-weight: 600; }
.dialog { text-align: center; padding-top: 28px; }
.dialog .art { width: 150px; margin: 0 auto 20px; transform: rotate(-4deg); }
.dialog .art .collage { box-shadow: 0 10px 24px rgba(0,0,0,.18); border: 4px solid #fff; border-radius: 18px; }
.dialog h2 { font-size: 26px; line-height: 32px; }
.dialog p { margin: 8px auto 24px; max-width: 340px; color: var(--muted); }
@media (min-width: 720px) {
  .overlay { align-items: center; }
  .sheet { border-radius: 20px; animation-name: pop; padding-bottom: 24px; }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } }
}

/* Toast */
.toast-root { position: fixed; left: 0; right: 0; bottom: 96px; z-index: 60; display: flex; justify-content: center; pointer-events: none; padding: 0 var(--pad); }
.toast { background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 16px; font-size: 14px; max-width: 420px; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: toast-in 260ms var(--ease-out); transition: opacity 200ms ease, transform 200ms ease; }
.toast.out { opacity: 0; transform: translateY(8px); }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } }

/* Done */
.done-page { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; text-align: center; padding-top: 40px; }
.done-page .art { width: 200px; margin: 0 auto 28px; transform: rotate(-3deg); }
.done-page .art .collage { border: 5px solid #fff; box-shadow: 0 14px 30px rgba(0,0,0,.18); border-radius: 20px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: 16px; margin: 28px 0; }
.stats3 > div { padding: 16px 8px; }
.stats3 > div + div { border-left: 1px solid var(--border); }
.stats3 b { display: block; font-family: var(--display); font-size: 26px; }
.stats3 span { font-size: 12px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .page, .page.back-in, .sheet, .toast { animation: fade 200ms ease; }
  .row.flash { animation: none; background: var(--live-bg); }
}

/* v4: title row, trip map with sticker pins, bottom sheet with tabs, horizontal poll cards with progress */
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bottombar .info b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#map-root { position: fixed; inset: 0; z-index: 0; }
#map-root[hidden] { display: none; }
#map { position: absolute; inset: 0; background: #ece9e4; }
.map-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--subtle); font-weight: 500; }
.map-top { position: fixed; top: 0; left: 0; right: 0; z-index: 25; display: flex; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 16px 0; pointer-events: none; }
.map-top .circle { pointer-events: auto; border: 0; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.leaflet-top.leaflet-right { top: calc(56px + env(safe-area-inset-top)); }
.leaflet-container { font-family: Geist, system-ui, sans-serif; }
.leaflet-tile-pane { filter: grayscale(0.7) brightness(1.04) contrast(0.92); }   /* mid-fi: quiet map so the stickers carry the color */
.sticker-pin, .dot-pin { background: none; border: 0; }
#map .sticker-pin img { width: 100% !important; height: auto; filter: drop-shadow(0 3px 4px rgba(0,0,0,.28)); transition: transform 160ms var(--ease-out); }
@media (hover: hover) and (pointer: fine) { #map .sticker-pin:hover img { transform: scale(1.1) !important; } }
.dot-pin span { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; border-radius: 15px; background: var(--text); color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.dot-pin.live span { background: var(--live); }
.tsheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-radius: 20px 20px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.14); display: flex; flex-direction: column; will-change: transform; }
.tsheet.anim { transition: transform 420ms cubic-bezier(0.32, 0.72, 0, 1); }
.tsheet-head { touch-action: none; cursor: grab; padding: 8px var(--pad) 4px; flex: none; }
.tsheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 0 auto 12px; }
.trip-head { display: flex; align-items: center; gap: 10px; }
.trip-head .grow { flex: 1; min-width: 0; }
.tsheet-body { flex: 1; overflow-y: auto; padding: 0 var(--pad) 104px; overscroll-behavior: contain; }
.strip-label { font-size: 13px; font-weight: 500; color: var(--muted); margin: 14px 0 8px; }
.today-strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad) 4px; scroll-padding: 0 var(--pad); scrollbar-width: none; }
.today-strip::-webkit-scrollbar { display: none; }
.today-card { flex: none; width: 250px; scroll-snap-align: start; display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 14px; text-align: left; transition: transform 160ms var(--ease-out); }
.today-card:active { transform: scale(0.98); }
.today-card .thumb { width: 56px; height: 56px; border-radius: 10px; flex: none; }
.today-card .body { min-width: 0; flex: 1; }
.today-card .body b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today-card .body span { display: block; font-size: 12px; color: var(--muted); }
.today-card.next { border-color: var(--text); }
.today-card.done { opacity: .6; }
.today-card.flash { animation: flash 1.6s ease 2; }
.tabs { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 16px 0 8px; }
.seg3 { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--bg-muted); border-radius: 10px; padding: 3px; }
.seg3 button { height: 36px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); transition: background-color 160ms ease, color 160ms ease; }
.seg3 button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.add-row .circle { width: 44px; height: 44px; border-style: dashed; border-color: var(--border-strong); }
.owe { font-size: 13px; font-weight: 500; white-space: nowrap; }
.owe.neg { color: var(--danger); }
.owe.pos { color: var(--live); }
.sum-card { border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 12px; margin: 4px 0 8px; }
.day { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 0; }
@media (min-width: 900px) {
  .tsheet { top: 0; right: auto; width: 460px; border-radius: 0; transform: none !important; box-shadow: 1px 0 0 var(--border); height: auto !important; }
  .tsheet .grab { display: none; }
  .tsheet-head { cursor: default; padding-top: 68px; }
  #map { left: 460px; }
}
.poll-progress { border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin: 18px 0 20px; }
.segs { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; }
.segs i { height: 6px; border-radius: 3px; background: var(--bg-muted); transition: background-color 300ms ease; }
.segs i.on { background: var(--text); }
.pp-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; }
.opt-card { border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
.opt-card.lead { border: 2px solid var(--text); padding: 11px; }
.opt-main { display: flex; gap: 12px; }
.opt-main .thumb { width: 84px; height: 84px; border-radius: 12px; flex: none; }
.opt-body { flex: 1; min-width: 0; }
.opt-title { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.opt-title b { font-weight: 600; font-size: 15px; line-height: 20px; }
.opt-bar { height: 8px; border-radius: 4px; background: var(--bg-muted); margin-top: 10px; overflow: hidden; }
