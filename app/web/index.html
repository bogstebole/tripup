<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TripUp: a group trip prototype. Your trips, the map, the dinner poll, the bill and squared up.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TripUp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TripUp</title>
  <link rel="manifest" href="manifest.json">
  <!-- The prototype is a phone app in a browser: the page itself never zooms or scrolls. Flutter writes its own
       viewport tag that allows pinch zoom up to 5×; on a phone one pinch or double tap then blew the whole app up,
       showed scrollbars and made the canvas redraw much larger (slow). Flutter handles every gesture itself, so the
       browser's are off. -->
  <style>
    html, body { margin: 0; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  </style>
  <script>
    (function () {
      var content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
      function lock() {
        var metas = document.querySelectorAll('meta[name="viewport"]');
        if (!metas.length) { var m = document.createElement('meta'); m.name = 'viewport'; m.content = content; document.head.appendChild(m); return; }
        metas.forEach(function (m) { if (m.content !== content) m.content = content; });
      }
      lock();
      new MutationObserver(lock).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
      // Safari ignores user-scalable=no for pinch; its own gesture events still let a page refuse it
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
